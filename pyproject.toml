[project]
name = "doomla"
version = "0.1.0"
description = "Example cyber range using Inspect Cyber"
authors = [{ name = "UK AI Security Institute" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # anthropic 2.x sends `api_key` as `Authorization: Bearer` instead of
  # `x-api-key`, which the UK AISI API key proxy rejects. Stay on anthropic 1.x
  # (and inspect-ai 0.3.282, the last release that allows it) until the proxy
  # accepts both headers.
  "inspect-ai==0.3.282",
  "inspect-cyber>=0.1.0,<0.2.0",
  "openai>=3.37.0,<4.0.0",
  "anthropic>=1.17.0,<2.0.0",
]

[dependency-groups]
dev = [
  "mypy>=2.4.0,<3.0.0",
  "pre-commit>=4.7.0,<5.0.0",
  "ruff>=0.17.2,<0.18.0",
  "types-pyyaml>=6.0.12,<7.0.0",
]
[tool.uv]
package = false

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # flake8
  "D",  # pydocstyle
  "I",  # isort
]
ignore = [
  "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.pydocstyle]
convention = "google"
