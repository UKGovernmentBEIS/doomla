[project]
name = "doomla"
version = "0.1.0"
description = "Example cyber range using Inspect Cyber"
authors = [{ name = "UK AI Security Institute" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai>=0.3.283,<0.4.0",
  "inspect-cyber>=0.1.0,<0.2.0",
  "openai>=3.37.0,<4.0.0",
  "anthropic>=2.2.0,<3.0.0",
]

[dependency-groups]
dev = [
  "mypy>=2.4.0,<3.0.0",
  "pre-commit>=4.7.0,<5.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "pytest-repeat>=0.9.4,<0.10.0",
  "ruff>=0.17.2,<0.18.0",
  "types-pyyaml>=6.0.12,<7.0.0",
]
aisi = [
  "aisitools",
]

[tool.uv]
package = false

[tool.uv.sources]
aisitools = { git = "ssh://git@github.com/AI-Safety-Institute/aisi-inspect-tools.git" }


[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # flake8
  "D",  # pydocstyle
  "I",  # isort
]
ignore = [
  "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.pydocstyle]
convention = "google"
