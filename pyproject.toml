[project]
name = "doomla"
version = "0.1.0"
description = "Example cyber range using Inspect Cyber"
authors = [{ name = "UK AI Security Institute" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai>=0.3.86,<0.4.0",
  "inspect-cyber>=0.1.0,<0.2.0",
  "openai>=1.82.0,<2.0.0",
  "anthropic>=0.52.2,<0.53.0",
]

[dependency-groups]
dev = [
  "mypy>=1.9.0,<2.0.0",
  "pre-commit>=3.6.2,<4.0.0",
  "pytest>=8.1.1,<9.0.0",
  "pytest-asyncio>=0.23.7,<0.24.0",
  "pytest-repeat>=0.9.3,<0.10.0",
  "ruff>=0.6.0,<0.7.0",
  "types-pyyaml>=6.0.12,<7.0.0",
]
aisi = [
  "aisitools",
]

[tool.uv]
package = false

[tool.uv.sources]
aisitools = { git = "ssh://git@github.com/AI-Safety-Institute/aisi-inspect-tools.git" }


[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # flake8
  "D",  # pydocstyle
  "I",  # isort
]
ignore = [
  "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.pydocstyle]
convention = "google"
